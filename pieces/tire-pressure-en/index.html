// =====================================================================
const PAL = {
  red: '#d9161f', redHi: '#ff4d4f', redLo: '#6e070d', night: '#0b1020', navy: '#121a33',
  hot: '#ff7a1a', hotHi: '#ffc35a', cold: '#4fb4ff', coldHi: '#bfe6ff', good: '#3ee07f', bad: '#ff3b3b',
  yellow: '#ffd23a', rubber: '#1b1c20', steel: '#c9ced6', select: '#3f7cff',
};
const lin = (x0, y0, x1, y1, stops) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; };
const rad = (x, y, r0, r1, stops, x1 = x, y1 = y) => { const g = ctx.createRadialGradient(x, y, r0, x1, y1, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; };
function rrPath(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fillRR(x, y, w, h, r, fill) { rrPath(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function poly(P, fill, stroke, lw = 2) { ctx.beginPath(); P.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function glow(color, blur, fn) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore(); }
function withAlpha(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
const mixC = (a, b, u) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), Bq = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bq[i], clamp(u)))).join(',')})`; };
const rgba = (h, a) => { const n = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); return `rgba(${n[0]},${n[1]},${n[2]},${a})`; };
// temperature colour: -1 cold blue, 0 neutral white-blue, 1 hot orange
const tempC = (k) => (k < 0 ? mixC('#cfe9ff', '#3d8cff', -k) : k < 0.5 ? mixC('#cfe9ff', '#ffd08a', k * 2) : mixC('#ffd08a', '#ff6a12', (k - 0.5) * 2));

// ---------------------------------------------------------------- type
function tText(str, x, y, size, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 800} ${size}px ${FONT}`; ctx.textAlign = o.align ?? 'center'; ctx.textBaseline = 'middle';
  if (o.letter) ctx.letterSpacing = o.letter + 'px';
  let s = 1; if (o.maxW) { const w = ctx.measureText(str).width; if (w > o.maxW) s = o.maxW / w; }
  ctx.translate(x, y); ctx.scale(s, s);
  if (o.shadow !== false) { ctx.fillStyle = o.shadowC ?? 'rgba(0,0,0,0.45)'; ctx.fillText(str, 0, size * 0.06); }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW ?? size * 0.14; ctx.strokeStyle = o.stroke; ctx.strokeText(str, 0, 0); }
  if (o.glowC) { ctx.shadowColor = o.glowC; ctx.shadowBlur = o.glowB ?? size * 0.5; }
  ctx.fillStyle = o.color ?? '#fff'; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function textW(str, size, weight = 800) { ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }

// a pill tag that springs in at t0 (and out at o.out), like the reference's value labels
function tag(str, x, y, t0, o = {}) {
  if (TT < t0 - 0.001) return;
  let k = springEase(TT - t0, 320, 15);
  if (o.out && TT > o.out) k *= 1 - EZ.i2((TT - o.out) / 0.2);
  if (k <= 0.001) return;
  const size = o.size ?? 44, padX = size * 0.5, w = textW(str, size, 800) + padX * 2 + (o.icon ? size * 1.0 : 0), h = size * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  fillRR(-w / 2, -h / 2 + 8, w, h, h * 0.32, 'rgba(0,0,0,0.35)');
  fillRR(-w / 2, -h / 2, w, h, h * 0.32, o.bg ?? 'rgba(14,18,30,0.86)');
  rrPath(-w / 2 + 1.5, -h / 2 + 1.5, w - 3, h - 3, h * 0.3); ctx.lineWidth = 3; ctx.strokeStyle = o.edge ?? 'rgba(255,255,255,0.18)'; ctx.stroke();
  let tx = 0;
  if (o.icon) { const ix = -w / 2 + padX + size * 0.4; o.icon(ix, 0, size * 0.42); tx = size * 0.5; }
  tText(str, tx, 2, size, { color: o.fg ?? '#fff', shadow: false, glowC: o.glowC, glowB: o.glowB });
  ctx.restore();
}

// ---------------------------------------------------------------- 7-segment LCD digits
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' };
function lcd(str, x, y, h, color, o = {}) {
  const w = h * 0.52, t = h * 0.13, gap = h * 0.17;
  const segs = { a: [0, 0, 1, 0], b: [1, 0, 1, 0.5], c: [1, 0.5, 1, 1], d: [0, 1, 1, 1], e: [0, 0.5, 0, 1], f: [0, 0, 0, 0.5], g: [0, 0.5, 1, 0.5] };
  const total = [...str].reduce((s, ch) => s + (ch === '.' ? h * 0.18 : w + gap), -gap);
  let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  ctx.save(); ctx.lineCap = 'round';
  const draw = (ch, on) => {
    if (ch === '.') { if (on) circle(cx + h * 0.02, y + h / 2 - t * 0.4, t * 0.6, color); cx += h * 0.18; return; }
    const set = SEG[ch] ?? '';
    for (const [k, [x0, y0, x1, y1]] of Object.entries(segs)) {
      const lit = set.includes(k);
      if (!lit && !o.ghost) continue;
      ctx.strokeStyle = lit ? color : (o.ghost || 'rgba(255,255,255,0.05)'); ctx.lineWidth = t;
      const sx = cx + x0 * w - y0 * h * 0.08, sy = y - h / 2 + y0 * h, ex = cx + x1 * w - y1 * h * 0.08, ey = y - h / 2 + y1 * h;
      const shrink = 0.16;
      ctx.beginPath(); ctx.moveTo(lerp(sx, ex, shrink), lerp(sy, ey, shrink)); ctx.lineTo(lerp(sx, ex, 1 - shrink), lerp(sy, ey, 1 - shrink)); ctx.stroke();
    }
    cx += w + gap;
  };
  if (o.glow !== false) { ctx.shadowColor = color; ctx.shadowBlur = h * 0.35; }
  for (const ch of str) draw(ch, true);
  ctx.restore();
}

// ---------------------------------------------------------------- cached static layers (drawn once per worker, deterministic)
const LAYERS = {};
function layer(key, w, h, fn) {
  if (LAYERS[key]) return LAYERS[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const prev = ctx; ctx = c.getContext('2d'); fn(w, h); ctx = prev;
  return (LAYERS[key] = c);
}
// a soft glowing dot sprite (for particles and lights), drawn with 'lighter'
function dotSprite(color, size = 64) {
  return layer('dot' + color + size, size, size, (w) => {
    ctx.fillStyle = rad(w / 2, w / 2, 0, w / 2, [[0, '#ffffff'], [0.18, color], [0.45, rgba(color, 0.35)], [1, rgba(color, 0)]]); ctx.fillRect(0, 0, w, w);
  });
}
function sprite(img, x, y, s, a = 1) { if (a <= 0.003) return; const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a; ctx.drawImage(img, x - s / 2, y - s / 2, s, s); ctx.globalAlpha = ga; }

// soft light pool / god ray
function lightCone(x, y, topW, botW, len, color, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = lin(x, y, x, y + len, [[0, rgba(color, a)], [1, rgba(color, 0)]]);
  ctx.beginPath(); ctx.moveTo(x - topW / 2, y); ctx.lineTo(x + topW / 2, y); ctx.lineTo(x + botW / 2, y + len); ctx.lineTo(x - botW / 2, y + len); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function bloom(x, y, r, color, a = 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= a; ctx.fillStyle = rad(x, y, 0, r, [[0, rgba(color, 0.9)], [0.25, rgba(color, 0.35)], [1, rgba(color, 0)]]); ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }

// heat shimmer lines rising from a point
function heatWaves(x, y, w, h, k, key = 'hw') {
  if (k <= 0.01) return;
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const R = RNG(key, i), x0 = x + (i - 2) * w / 5 + R.n(12), ph = TT * 1.6 + R.f() * 3, rise = (ph % 1);
    ctx.globalAlpha = k * 0.5 * Math.sin(rise * Math.PI);
    ctx.strokeStyle = 'rgba(255,220,170,0.9)'; ctx.lineWidth = 5;
    ctx.beginPath();
    for (let j = 0; j <= 20; j++) { const u = j / 20, yy = y - rise * h * 0.4 - u * h * 0.6, xx = x0 + Math.sin(u * 9 + TT * 5 + i) * 14 * u; j ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  }
  ctx.restore();
}
// =====================================================================
//  car.js — the two constant characters: THE WHEEL and THE RED CAR (side view, facing left, like the reference).
//  drawWheel(cx, cy, R, o)   cy = wheel centre at full pressure; the ground is at cy + R.
//    o.rot      rotation (rad)          o.heat   0..1 orange glow of hot rubber
//    o.sag      0..1 under-inflated     o.xray   0..1 see-through tyre with the air inside
//    o.temp     -1..1 colour of the air  o.energy speed of the air particles   o.cavity 0.8..1.1 size of the air ring
//    o.marker   yellow mark on the sidewall (shows the turning)     o.spin 0..1 motion blur of a fast wheel
//    o.outline  0..1 dashed green "really full" outline              o.splash / o.wet water on the tyre
//  drawCar(x, y, o)   x, y = front wheel centre; the rear wheel is at x + 640. o.wheel = options for both wheels.
// =====================================================================
const WR = 120;                                       // the wheel radius at car scale
const WHEELBASE = 640;

function tirePts(R, sag, n = 96) {
  const drop = sag * R * 0.1, bulge = sag * 0.09, P = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU; let x = Math.cos(a) * R, y = Math.sin(a) * R + drop;
    if (y > R) y = R;
    const low = clamp((Math.sin(a) - 0.25) / 0.75); x *= 1 + bulge * low * low * 1.4;
    P.push([x, y]);
  }
  return { P, drop };
}
function pathPts(P) { ctx.beginPath(); P.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); }

function sidewallText(str, r, a0, size, color) {
  ctx.save(); ctx.font = `800 ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let a = a0; const per = (size * 0.66) / r;
  for (const ch of str) { ctx.save(); ctx.rotate(a); ctx.translate(0, -r); ctx.fillText(ch, 0, 0); ctx.restore(); a += per * (ch === ' ' ? 0.6 : 1); }
  ctx.restore();
}

function drawWheel(cx, cy, R, o = {}) {
  const rot = o.rot ?? 0, heat = clamp(o.heat ?? 0), sag = clamp(o.sag ?? 0), xray = clamp(o.xray ?? 0), spin = clamp(o.spin ?? 0);
  const { P, drop } = tirePts(R, sag);
  ctx.save(); ctx.translate(cx, cy);
  // contact shadow
  ell(0, R + 4, R * (0.95 + sag * 0.25), R * 0.09, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = rad(0, R, 0, R * 1.3, [[0, 'rgba(0,0,0,0.35)'], [1, 'rgba(0,0,0,0)']]); ctx.fillRect(-R * 1.4, R - 30, R * 2.8, 60);
  // ---- the tyre
  withAlpha(1 - xray * 0.72, () => {
    pathPts(P);
    ctx.fillStyle = rad(-R * 0.25, -R * 0.3 + drop, R * 0.2, R * 1.1, [[0, '#33363d'], [0.7, '#1d1f24'], [1, '#101114']]); ctx.fill();
    // tread blocks on the edge
    ctx.save(); pathPts(P); ctx.clip();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = R * 0.035;
    for (let i = 0; i < 44; i++) { const a = rot + (i / 44) * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 0.94, Math.sin(a) * R * 0.94 + drop); ctx.lineTo(Math.cos(a) * R * 1.02, Math.sin(a) * R * 1.02 + drop); ctx.stroke(); }
    ctx.restore();
    // sidewall: a lit rim on the upper left, embossed lettering
    ctx.save(); ctx.translate(0, drop);
    ctx.lineWidth = R * 0.05; ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.beginPath(); ctx.arc(0, 0, R * 0.82, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
    ctx.lineWidth = R * 0.012; ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(0, 0, R * 0.7, 0, TAU); ctx.stroke();
    ctx.rotate(rot);
    if (spin < 0.6) withAlpha(1 - spin / 0.6, () => {
      sidewallText('205/55 R16 91V', R * 0.8, -0.95, R * 0.085, 'rgba(160,166,178,0.38)');
      sidewallText('TUBELESS', R * 0.8, 2.1, R * 0.08, 'rgba(160,166,178,0.33)');
    });
    if (o.marker) { ctx.save(); ctx.rotate(-0.2); glow('rgba(255,210,58,0.8)', R * 0.12, () => fillRR(-R * 0.03, -R * 0.93, R * 0.06, R * 0.2, R * 0.03, PAL.yellow)); ctx.restore(); }
    ctx.restore();
    if (spin > 0) { ctx.save(); ctx.translate(0, drop); ctx.strokeStyle = `rgba(150,155,165,${0.12 * spin})`; for (let i = 0; i < 6; i++) { ctx.lineWidth = 2 + i; ctx.beginPath(); ctx.arc(0, 0, R * (0.74 + i * 0.04), 0, TAU); ctx.stroke(); } ctx.restore(); }
    // heat: hot rubber glows from the contact patch up
    if (heat > 0) {
      ctx.save(); pathPts(P); ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rad(0, R * 0.9, R * 0.1, R * 1.6, [[0, rgba('#ff8a1e', 0.95 * heat)], [0.5, rgba('#ff5a0a', 0.55 * heat)], [1, rgba('#ff3a00', 0.18 * heat)]]);
      ctx.fillRect(-R * 1.2, -R * 1.2, R * 2.4, R * 2.4);
      ctx.restore();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = R * 0.05; ctx.strokeStyle = rgba('#ffb04a', 0.6 * heat); ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = R * 0.45 * heat;
      pathPts(P); ctx.stroke(); ctx.restore();
      bloom(0, R * 0.95, R * 0.9, '#ff7a1a', 0.55 * heat);
    }
  });
  if (o.wet) withAlpha(o.wet, () => { ctx.save(); pathPts(P); ctx.clip(); ctx.fillStyle = lin(0, -R, 0, R, [[0, 'rgba(160,210,255,0.25)'], [1, 'rgba(60,120,200,0.05)']]); ctx.fillRect(-R, -R, R * 2, R * 2); ctx.restore(); });
  // ---- x-ray: the air inside the tyre
  if (xray > 0) {
    const cav = o.cavity ?? 1;
    ctx.save(); ctx.translate(0, drop);
    withAlpha(xray, () => {
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(150,200,255,0.55)'; pathPts(P.map(([x, y]) => [x, y - drop])); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, R * 0.95 * cav, 0, TAU); ctx.arc(0, 0, R * 0.68, 0, TAU, true);
      ctx.fillStyle = 'rgba(42,91,184,0.16)'; ctx.fill('evenodd');
      airParticles(R, o, cav);
    });
    ctx.restore();
  }
  // ---- the rim (rotates), the disc and the caliper
  ctx.save(); ctx.translate(0, drop);
  circle(0, 0, R * 0.665, '#0d0e11');
  ctx.save(); ctx.rotate(rot);
  circle(0, 0, R * 0.52, lin(-R * 0.5, -R * 0.5, R * 0.5, R * 0.5, [[0, '#9ba1aa'], [1, '#4c5058']]));
  ctx.strokeStyle = 'rgba(40,42,48,0.6)'; ctx.lineWidth = R * 0.02; ctx.beginPath(); ctx.arc(0, 0, R * 0.36, 0, TAU); ctx.stroke();
  for (let i = 0; i < 18; i++) { const a = (i / 18) * TAU; circle(Math.cos(a) * R * 0.44, Math.sin(a) * R * 0.44, R * 0.016, 'rgba(30,32,36,0.8)'); }
  ctx.restore();
  // caliper (fixed): red, upper right like the reference
  ctx.save(); ctx.rotate(-0.75);
  ctx.beginPath(); ctx.arc(0, 0, R * 0.55, -0.42, 0.42); ctx.arc(0, 0, R * 0.36, 0.42, -0.42, true); ctx.closePath();
  ctx.fillStyle = lin(R * 0.36, -R * 0.2, R * 0.55, R * 0.2, [[0, '#ff4a3d'], [0.5, '#e01b1b'], [1, '#8f0b0b']]); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(0, 0, R * 0.52, -0.3, 0.1); ctx.arc(0, 0, R * 0.5, 0.1, -0.3, true); ctx.closePath(); ctx.fill();
  ctx.restore();
  // spokes (with motion blur copies when spinning fast)
  const copies = spin > 0.05 ? 1 + Math.round(spin * 7) : 1;
  for (let k = 0; k < copies; k++) {
    ctx.save(); ctx.rotate(rot - (copies > 1 ? (k / copies) * 0.55 * spin : 0)); ctx.globalAlpha *= copies > 1 ? (k === 0 ? 0.55 : 0.6 / copies) : 1;
    for (let s = 0; s < 5; s++) {
      ctx.save(); ctx.rotate((s / 5) * TAU);
      const r0 = R * 0.12, r1 = R * 0.62, w0 = R * 0.075, w1 = R * 0.13;
      ctx.beginPath(); ctx.moveTo(-w0, -r0); ctx.lineTo(-w1, -r1); ctx.quadraticCurveTo(0, -r1 - R * 0.03, w1, -r1); ctx.lineTo(w0, -r0); ctx.closePath();
      ctx.fillStyle = lin(-w1, 0, w1, 0, [[0, '#f2f4f7'], [0.48, '#c3c8d0'], [0.52, '#8c929c'], [1, '#6b717a']]); ctx.fill();
      ctx.strokeStyle = 'rgba(20,22,26,0.45)'; ctx.lineWidth = R * 0.012; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  // rim lip
  ctx.beginPath(); ctx.arc(0, 0, R * 0.665, 0, TAU); ctx.arc(0, 0, R * 0.605, 0, TAU, true);
  ctx.fillStyle = lin(0, -R * 0.66, 0, R * 0.66, [[0, '#f4f6f9'], [0.45, '#b9bec6'], [1, '#5f646c']]); ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = R * 0.01; ctx.beginPath(); ctx.arc(0, 0, R * 0.605, 0, TAU); ctx.stroke();
  // valve stem
  ctx.save(); ctx.rotate(rot + (o.valveA ?? -2.2)); fillRR(-R * 0.022, -R * 0.7, R * 0.044, R * 0.09, R * 0.015, '#2b2d31'); circle(0, -R * 0.705, R * 0.025, '#a7adb5'); ctx.restore();
  // hub
  circle(0, 0, R * 0.15, lin(-R * 0.15, -R * 0.15, R * 0.15, R * 0.15, [[0, '#eef0f3'], [1, '#70757d']]));
  ctx.save(); ctx.rotate(rot); for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU + 0.6; circle(Math.cos(a) * R * 0.09, Math.sin(a) * R * 0.09, R * 0.022, '#3b3e44'); } ctx.restore();
  circle(0, 0, R * 0.045, '#25272c');
  ctx.restore();
  // dashed outline: the size a really full tyre would have
  if (o.outline) {
    const u = clamp(o.outline);
    ctx.save(); ctx.translate(0, 0); ctx.setLineDash([R * 0.09, R * 0.06]); ctx.lineDashOffset = -TT * 40;
    ctx.lineWidth = R * 0.04; ctx.strokeStyle = rgba('#3ee07f', u); ctx.shadowColor = '#3ee07f'; ctx.shadowBlur = R * 0.25 * u;
    ctx.beginPath(); ctx.arc(0, 0, R * (1.02 + 0.06 * (1 - u)), -Math.PI / 2, -Math.PI / 2 + TAU * EZ.o3(u)); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// the air: deterministic particles drifting in the tyre's ring. Hot air is orange and fast, cold air blue and slow.
function airParticles(R, o, cav = 1) {
  const n = o.count ?? 240, energy = o.energy ?? 1, temp = o.temp ?? 0;
  const tq = Math.round(clamp((temp + 1) / 2) * 10) / 10 * 2 - 1;
  const img = dotSprite(tempC(tq).replace(/rgb\((\d+),(\d+),(\d+)\)/, (m, r, g, b) => '#' + [r, g, b].map((v) => (+v).toString(16).padStart(2, '0')).join('')), 48);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const t = TT * (0.35 + energy * 0.9);
  for (let i = 0; i < n; i++) {
    const Rr = RNG('air', i), a0 = Rr.f() * TAU, u0 = Rr.f(), w1 = Rr.r(0.6, 1.6), w2 = Rr.r(0.8, 2.2), ph = Rr.f() * TAU;
    const a = a0 + Math.sin(t * w1 + ph) * 0.12 * energy + t * 0.04 * (Rr.f() - 0.5);
    const u = clamp(u0 + Math.sin(t * w2 * 1.7 + ph * 2) * 0.22 * energy, 0.02, 0.98);
    const r = R * (0.7 + u * (0.95 * cav - 0.7));
    const s = R * (0.075 + Rr.f() * 0.05) * (o.psize ?? 1);
    sprite(img, Math.cos(a) * r, Math.sin(a) * r, s, 0.55 + 0.45 * Math.sin(t * 3 + ph));
  }
  ctx.restore();
}

// ---------------------------------------------------------------- the red car (front wheel at 0,0, facing left)
function carBodyPath() {
  const r = WR + 24, s = 0.58;

// =====================================================================
//  main.js — shots, camera, transitions, captions, grade. renderFrame(t) draws one frame.
//  A shot: S(t0, { tr, cam, punch, shake, tense, draw, ui, sfx }) — every time is absolute (seconds).
//    cam   [[t, x, y, z], ...]  the world point (x, y) sits at the screen focus (540, FOCUS_Y), zoom z, eased between keys
//    punch [[t, amount], ...]   fast spring zoom steps (each one stays)
//    shake [[t, amp, dur], ...] decaying screen shake
//    tense [t0, t1]             heavy vignette + a little desaturation (the slow push is in cam)
//    tr    the transition INTO this shot: cut | whipL | whipR | whipU | zoomIn | zoomOut | flash | slide | dissolve
// =====================================================================
const SHOTS = [];
function S(t0, o) { SHOTS.push({ t0, ...o }); }
const TR_DUR = { cut: 0, flash: 0.3, whipL: 0.28, whipR: 0.28, whipU: 0.28, zoomIn: 0.32, zoomOut: 0.34, slide: 0.32, dissolve: 0.5 };

function finalizeShots() {
  SHOTS.sort((a, b) => a.t0 - b.t0);
  SHOTS.forEach((s, i) => { s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : DURATION; s.i = i; s.tr = s.tr || 'cut'; });
}
function shotAt(t) { let s = SHOTS[0]; for (const x of SHOTS) if (t + 1e-6 >= x.t0) s = x; return s; }

function camAt(s) {
  const K = s.cam || [[s.t0, 0, 0, 1]];
  let x = K[0][1], y = K[0][2], z = K[0][3];
  for (let i = 1; i < K.length; i++) {
    const [t, kx, ky, kz, ez] = K[i], [tp] = K[i - 1];
    if (TT <= tp) break;
    const e = (EZ[ez || 'io'] || EZ.io)(clamp((TT - tp) / Math.max(0.001, t - tp)));
    x = lerp(K[i - 1][1], kx, e); y = lerp(K[i - 1][2], ky, e); z = lerp(K[i - 1][3], kz, e);
  }
  for (const [t, a] of s.punch || []) z *= 1 + a * springEase(TT - t, 380, 19);

  for (const [t, amp, dur = 0.4] of s.shake || []) { const u = (TT - t) / dur; if (u < 0 || u > 1) continue; const R = RNG('shk', Math.round(TT * FPS)); sx += R.n(amp) * (1 - u) ** 2; sy += R.n(amp) * (1 - u) ** 2; }

let CAM = { x: 0, y: 0, z: 1 };
function drawShot(s, c) {

  ctx.setTransform(1, 0, 0, 1, cm.sx * 0.4, cm.sy * 0.4);

// ---------------------------------------------------------------- transitions
function blurCopies(g, src, dx, dy, n = 6, scale = 1, alpha = 1) {
  for (let k = 0; k < n; k++) {

    g.save(); g.globalAlpha = alpha / (n === 1 ? 1 : n * 0.5);
    g.translate(W / 2 + dx + f * dx * 0.3, H / 2 + dy + f * dy * 0.3); g.scale(scale, scale);
    g.drawImage(src, -W / 2, -H / 2, W, H); g.restore();
  }
}

    else { const k = EZ.o3((u - 0.5) * 2); blurCopies(g, B, 0, 0, 1 + Math.round((1 - k) * 4), 1.7 - 0.7 * k); g.fillStyle = `rgba(255,255,255,${(1 - k) * 0.25})`; g.fillRect(0, 0, W, H); }
  } else if (type === 'zoomOut') {
    if (u < 0.5) { const k = EZ.i3(u * 2); blurCopies(g, A, 0, 0, 1 + Math.round(k * 4), 1 - k * 0.45); }
    else { const k = EZ.o3((u - 0.5) * 2); blurCopies(g, B, 0, 0, 1 + Math.round((1 - k) * 4), 1.5 - 0.5 * k); }
  } else if (type === 'flash') {
    g.drawImage(u < 0.5 ? A : B, 0, 0, W, H); g.fillStyle = `rgba(255,255,255,${Math.pow(1 - Math.abs(u - 0.5) * 2, 1.3)})`; g.fillRect(0, 0, W, H);

}

// ---------------------------------------------------------------- captions (the reference's karaoke: spoken word bright, the rest dim, keyword in a selection box)
function captions(g) {
  const c = CHUNKS.find((k) => TT >= k.t0 - 0.03 && TT < k.t1); if (!c) return;
  const s = shotAt(TT); if (s.noCap) return;
  ctx = g; ctx.setTransform(1, 0, 0, 1, 0, 0);
  const size = 74, sp = size * 0.28, ws = [];
  for (let i = c.a; i <= c.b; i++) ws.push(WORDS[i]);
  const wid = ws.map((w) => textW(w.w, size, 800));
  let lines = [[0, ws.length]]; const total = wid.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  if (total > 900 && ws.length > 1) { let acc = 0, cut = 1; for (let i = 0; i < ws.length; i++) { acc += wid[i] + sp; if (acc > total / 2) { cut = Math.max(1, i); break; } } lines = [[0, cut], [cut, ws.length]]; }
  const lh = size * 1.22;
  ctx.save(); ctx.translate(W / 2, s.capY ?? CAP_Y);
  lines.forEach(([a, b], li) => {
    const lw = wid.slice(a, b).reduce((p, q) => p + q, 0) + sp * (b - a - 1);
    let x = -lw / 2; const y = (li - (lines.length - 1) / 2) * lh;
    for (let i = a; i < b; i++) {
      const w = ws[i], k = clamp((TT - w.s + 0.04) / 0.12), act = TT >= w.s - 0.04 && TT < w.e;
      if (k <= 0) { x += wid[i] + sp; continue; }
      const cx = x + wid[i] / 2;
      ctx.save(); ctx.translate(cx, y + (1 - EZ.o3(k)) * 18); ctx.globalAlpha = EZ.o2(k);
      if (w.k && TT >= w.s - 0.04) {                 // selection box with handles
        const bk = springEase(TT - w.s, 420, 22), bw = wid[i] + 26, bh = size * 1.18;
        ctx.save(); ctx.scale(0.9 + 0.1 * bk, 0.9 + 0.1 * bk);
        fillRR(-bw / 2, -bh / 2, bw, bh, 8, 'rgba(40,92,255,0.28)');
        ctx.lineWidth = 3.5; ctx.strokeStyle = PAL.select; rrPath(-bw / 2, -bh / 2, bw, bh, 8); ctx.stroke();
        for (const [hx, hy] of [[-1, -1], [1, 1]]) { circle(hx * bw / 2, hy * bh / 2, 7, '#fff'); ctx.lineWidth = 3; ctx.strokeStyle = PAL.select; ctx.beginPath(); ctx.arc(hx * bw / 2, hy * bh / 2, 7, 0, TAU); ctx.stroke(); }
        ctx.restore();
      }
      const col = act || w.k ? '#ffffff' : 'rgba(230,234,245,0.62)';
      const tint = w.c === 'hot' && act ? '#ffd2a0' : w.c === 'cold' && act ? '#d4ecff' : col;
      tText(w.w, 0, 0, size, { color: tint, weight: act || w.k ? 800 : 700, shadowC: 'rgba(0,0,0,0.75)', stroke: 'rgba(0,0,0,0.35)', strokeW: 8 });
      ctx.restore(); x += wid[i] + sp;
    }
  });
  ctx.restore();
}

let GRAIN = null;
function grainTile() {
  if (GRAIN) return GRAIN; GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const g = GRAIN.getContext('2d'), d = g.createImageData(256, 256), R = RNG('grain');
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + R.n(70); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return GRAIN;
}
function tenseK(t) {
  let k = 0;
  for (const s of SHOTS) { if (!s.tense) continue; const [a, b] = s.tense; k = Math.max(k, clamp((t - a) / 0.35) * clamp((b - t) / 0.3 + 0.0001)); }
  return clamp(k);
}
function vignetteFx(g, a, r0) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const gr = g.createRadialGradient(W / 2, H * 0.46, H * r0, W / 2, H * 0.46, H * 0.75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
}

const CV = {};
function cvs(name) { if (!CV[name]) { CV[name] = document.createElement('canvas'); CV[name].width = PW; CV[name].height = PH; } return CV[name]; }
function renderFrame(t, target) {
  if (!SHOTS.length || SHOTS[0].t1 == null) finalizeShots();

  F = Math.round(t * FPS); B = Math.floor(t * 12); TT = t;
  const s = shotAt(t), A = cvs('A'), Bc = cvs('B'), M = cvs('M'), g = M.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.filter = 'none'; g.globalAlpha = 1;
  let done = false;
  for (const nx of [s, SHOTS[s.i + 1]]) {
    if (!nx || nx.i === 0) continue;
    const d = TR_DUR[nx.tr] ?? 0; if (!d) continue;
    const a = nx.t0 - d / 2, b = nx.t0 + d / 2;
    if (t >= a && t < b) { drawShot(SHOTS[nx.i - 1], A); drawShot(nx, Bc); composeTransition(g, A, Bc, nx.tr, (t - a) / d); done = true; break; }
  }
  if (!done) { drawShot(s, A); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(A, 0, 0); }
  const out = main.getContext('2d'), tk = tenseK(t);
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over';
  out.filter = `saturate(${1.12 - 0.25 * tk}) contrast(${1.05 + 0.08 * tk})`;
  const cutK = s.tr === 'cut' && s.i > 0 ? 1 + 0.05 * (1 - springEase(t - s.t0, 300, 16)) : 1;
  out.save(); out.translate(W / 2, H / 2); out.scale(cutK, cutK); out.drawImage(M, -W / 2, -H / 2, W, H); out.restore();
  out.filter = 'none';
  vignetteFx(out, 0.42 + 0.5 * tk, 0.3 - 0.12 * tk);
  captions(out);
  out.setTransform(1, 0, 0, 1, 0, 0);
  out.save(); out.globalAlpha = 0.05; out.globalCompositeOperation = 'overlay'; const R = RNG('gofs', F);
  out.translate(-R.f() * 256, -R.f() * 256); out.fillStyle = out.createPattern(grainTile(), 'repeat'); out.fillRect(0, 0, W + 256, H + 256); out.restore();
  // fade in from black at the very start, out at the end
