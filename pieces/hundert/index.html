// ---------------------------------------------------------------------
//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);
//  E0 = the current era's start; DEFER = overlay queue (captions drawn after the camera); SPARK_AT = the hero's screen spot
//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------
let TT = 0, E0 = 0, DEFER = null, SPARK_AT = null;

// ---------------------------------------------------------------------
//  springs: closed-form, so any frame can be drawn on its own (deterministic, no state)

//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------
const SPRING = {
  snappy: { k: 320, d: 30 },    // UI: buttons, toggles, leading edges
  smooth: { k: 170, d: 26 },    // cards, containers, the camera

// ---------------------------------------------------------------------
//  layout for several formats (9:16, 1:1, 16:9, 4:5 from one piece): place things by fractions of the frame,

// ---------------------------------------------------------------------
const LX = (f) => f * W, LY = (f) => f * H, UNIT = Math.min(W, H) / 1080, PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;

// ---------------------------------------------------------------------

  orange: '#ff8a1e', orangeD: '#d4520a', orangeL: '#ffc35c',
  blue: '#2f6df6', blueD: '#1d48b8', blueL: '#7fb0ff',
  red: '#ef3b3b', redD: '#a81f2a', pink: '#ff4fa3', yellow: '#ffd23f', gold: '#ffc21a', goldD: '#c98a00',
  cash: '#4fbf6b', cashD: '#2e8a4a', cashL: '#a6f0b4',

// ---------------------------------------------------------------- money HUD (top of frame, screen space)
const fmtEUR = (v, cents = false) => {
  const neg = v < 0; v = Math.abs(v);
  const [i, d] = v.toFixed(cents ? 2 : 0).split('.');

};
// value rolls between keyframes [[t, v], ...] (absolute times); deltas pop out in red/green

  const x = o.x ?? W / 2, y = o.y ?? 250, cents = o.cents ?? false;
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const u = EZ.o3(clamp((TT - keys[i][0]) / 0.7)); v += (keys[i][1] - keys[i - 1][1]) * u; }

  fillRR(-w / 2, -70, w, 46, { tl: 26 } ? 26 : 0, '#231c40'); ctx.fillStyle = '#141026'; ctx.fillRect(-w / 2, -40, w, 16);
  tText(title, 0, -46, 26, { color: '#9f95c9', shadow: false, letter: 4, weight: 800 });

    ctx.restore();
  }
}

// ---------------------------------------------------------------- small things

// a 100-euro note (green-ish orange like the real one is too subtle: we keep the series' green cash look, big "100")
function euro100(x, y, w, rot = 0, flip = 1) {
  const h = w * 0.52;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, flip);
  fillRR(-w / 2 + 6, -h / 2 + 8, w, h, w * 0.05, 'rgba(0,0,0,0.25)');
  fillRR(-w / 2, -h / 2, w, h, w * 0.05, flip > 0 ? '#3fae5a' : '#2f8a47');
  fillRR(-w / 2 + w * 0.04, -h / 2 + h * 0.08, w * 0.92, h * 0.84, w * 0.04, flip > 0 ? '#6fd18a' : '#4fae68');
  circ(-w * 0.22, 0, h * 0.3, flip > 0 ? '#2f8a47' : '#226b3a');
  if (flip > 0) {
    tText('€', -w * 0.22, 2, h * 0.36, { color: '#e9ffe9', shadow: false });
    tText('100', w * 0.2, 4, h * 0.42, { color: '#ffffff', stroke: '#1f6b35', strokeW: h * 0.06, shadow: false });
    tText('100', -w * 0.38, -h * 0.3, h * 0.13, { color: '#e9ffe9', shadow: false });
  }
  ctx.restore();
}
// a falling note: flutters left/right, rocks, lands at yEnd and lies flat
function fallingNote(t0, x0, y0, yEnd, w) {
  if (TT < t0) { euro100(x0, y0, w, -0.2); return; }
  const t = TT - t0, v = 520, y = Math.min(yEnd, y0 + v * t + 60 * t * t), landed = y >= yEnd;
  const tl = landed ? (yEnd - y0) / v * 0.9 : t, x = x0 + Math.sin(tl * 4.2) * 110 + tl * 40, rot = landed ? 0.05 : Math.sin(tl * 5.2) * 0.7, sq = landed ? 0.22 : 0.5 + 0.5 * Math.abs(Math.cos(tl * 5.2));
  ctx.save(); ctx.translate(x, y); ctx.scale(1, sq); euro100(0, 0, w, rot); ctx.restore();
}

//    cam   [[t, x, y, z], ...]  the world point (x, y) sits at the screen centre, zoom z, eased between keys
//    punch [[t, amount], ...]   spring zoom steps (each one stays), the "zoom punch"
//    shake [[t, amp, dur], ...] decaying screen shake
//    tr    the transition INTO this shot: cut | whipL | whipR | whipU | zoomIn | zoomOut | flash | glitch | spin | slide | iris
//    sfx   [[t, name, ...args]] sounds for this shot (score.js plays them; transitions add their own)

const SHOTS = [];

function finalizeShots() {

// ---------------------------------------------------------------- captions (karaoke)

// ---------------------------------------------------------------- grade: saturation, contrast, vignette, grain
