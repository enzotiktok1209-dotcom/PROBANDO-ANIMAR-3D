    const tHit=Math.sqrt(2*(y0-.17)/g);
    if(tf<tHit){y=y0-.5*g*tf*tf;rz=-tf*1.6;}
    else{const tb=tf-tHit;const v=1.1;y=.17+Math.max(0,v*tb-.5*g*tb*tb);rz=-tHit*1.6+Math.sin(Math.min(tb,.5)*8)*.06*Math.exp(-tb*5);}
    muff.position.set(MC.x+Math.min(tf,.4)*.5,y-LIFT,MC.z+Math.min(tf,.4)*.3);muff.rotation.set(0,Math.min(tf,.4)*.5,rz);}
  // in shot 2 muffler rests on the floor further out
  if(shot===2){muff.position.set(3.3,.17-LIFT,.5);muff.rotation.set(0,.6,-tHitConst());}
  // engine pulses: firing at 2.4 (start), then rhythm
  const fire=(t>2.35)?1:0;
  const pulse=fire?Math.pow(.5+.5*Math.sin((t-2.35)*Math.PI*2*6),3):0;
  // smoke
  puffs.forEach((p,i)=>{const birth=2.35+i*.045;const a=t-birth;if(a<0||shot===1){p.s.visible=false;return}
    p.s.visible=true;const life=1.6;const k=a/life;
    p.s.position.set(PIPE_END.x+.1+a*2.2,PIPE_END.y+a*(.35+p.dy),PIPE_END.z+a*p.dz);
    const s=(p.sz*.3+k*.9);p.s.scale.set(s,s,s);p.s.material.opacity=clamp(.4*(1-k))*(t<2.6?(t-2.35)/.25:1);});
  // rings: spawn every 0.11s from 2.5
  rings.forEach((r,i)=>{const birth=2.5+i*.11;const a=t-birth;if(a<0||a>1.1||shot===1){r.visible=false;return}
    r.visible=true;const k=a/1.1;
    r.position.set(PIPE_END.x+.35+a*3.0,PIPE_END.y+.05+Math.sin(a*7)*.05,PIPE_END.z+Math.cos(a*7)*.05);
    const s=.18+k*1.15;r.scale.set(s,s,s);r.rotation.set(0,Math.PI/2+.12,Math.sin(a*5)*.08);
    r.material.opacity=clamp(Math.min(a/.12,1)*(1-k)*.95);});
  // flame bursts on "fires"/ engine pops
  const burst=Math.max(t>3.4&&t<3.6?1-Math.abs(t-3.5)/.1:0,t>4.85?1-Math.abs(t-4.95)/.12:0,shot===2?pulse*.35:0);
  flame.visible=flameCore.visible=burst>.02&&shot===2;
  flame.position.set(PIPE_END.x+.22,PIPE_END.y,PIPE_END.z);flameCore.position.set(PIPE_END.x+.16,PIPE_END.y,PIPE_END.z);
  flame.scale.set(.6+burst,.5+burst*1.3,.6+burst);flameCore.scale.copy(flame.scale);
  flame.material.opacity=clamp(burst*1.2);flameCore.material.opacity=clamp(burst*1.4);
  exLight.position.copy(PIPE_END).x+=.3;exLight.intensity=shot===2?burst*6:0;
  // car shakes with engine
  car.position.y=LIFT+(shot===2?Math.sin(t*90)*.004*fire:0);
  // x-ray from 4.25
  const xr=shot===2?ease((t-4.25)/.5):0;interior.visible=xr>0;
  for(const m of bodyMats){m.opacity=1-xr*.82;m.depthWrite=xr<.5;}
  // orbs bob
  orbs.forEach((o,i)=>o.position.y=.4+Math.sin(t*2+i)*.08);
  // captions
  let w='';for(const [s,x] of WORDS)if(t>=s)w=x;cap.textContent=w;
  renderer.render(scene,camera);
};
function tHitConst(){return Math.sqrt(2*(MC.y+LIFT-.17)/9.8)*1.6}
document.fonts.load('800 64px M').then(()=>{window.READY=true});
</script></body></html>
