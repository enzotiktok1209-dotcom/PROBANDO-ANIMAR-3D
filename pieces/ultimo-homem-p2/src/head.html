function buildSubs() {
  const subs = [];
  PHR.forEach(([t0, t1, txt], pi) => {

    chunks.forEach((lines, ci) => { const s = lines[0][0].t0; subs.push({ t0: s, lines }); });
  });
  subs.forEach((s, i) => { s.t1 = i + 1 < subs.length ? subs[i + 1].t0 : DURATION; });
