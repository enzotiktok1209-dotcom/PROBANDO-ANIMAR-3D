}

//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);
//  E0 = the current era's start; DEFER = overlay queue (captions drawn after the camera); SPARK_AT = the hero's screen spot
//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------
let TT = 0, E0 = 0, DEFER = null, SPARK_AT = null;
const ev = (t, d = 0.25) => clamp((TT - t) / d);

// ---------------------------------------------------------------------
//  springs: closed-form, so any frame can be drawn on its own (deterministic, no state)
//  springEase(t, k, d)       0 -> 1 over time t >= 0 (stiffness k, damping d): accelerates, overshoots a hair, settles
//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------
const SPRING = {
  snappy: { k: 320, d: 30 },    // UI: buttons, toggles, leading edges
  smooth: { k: 170, d: 26 },    // cards, containers, the camera
  heavy: { k: 90, d: 19 },      // big type, logos, large objects
  playful: { k: 260, d: 14 },   // mascots, stickers: visible overshoot

  return v;
}

// ---------------------------------------------------------------------
//  layout for several formats (9:16, 1:1, 16:9, 4:5 from one piece): place things by fractions of the frame,
//  size them by UNIT (1 at 1080 on the short side). LX(0.5), LY(0.62), 120 * UNIT. PORTRAIT / WIDE pick layouts.
// ---------------------------------------------------------------------
const LX = (f) => f * W, LY = (f) => f * H, UNIT = Math.min(W, H) / 1080, PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;

// ---------------------------------------------------------------------
//  the user's own assets (screenshots, logos): files in <piece>/assets/ that tools/build.mjs embeds in the page.
//  asset('logo.png') -> the Image (or null); drawAsset(name, x, y, w, h, { fit: 'contain'|'cover', r, alpha })

// ---------------------------------------------------------------- shapes

// ---------------------------------------------------------------- backdrops
// full-frame sunburst (the reference's signature backdrop), rotating slowly
function rays(c0, c1, o = {}) {

// ---------------------------------------------------------------- type
function tText(str, x, y, size, o = {}) {

// sticker / tag: a pill that pops in on a spring at t0 (absolute), tilts a little, has a hard shadow
function sticker(str, x, y, t0, o = {}) {

  tText(str, 0, 2, size, { color: o.fg ?? '#fff', shadow: false });

// ---------------------------------------------------------------- money HUD (top of frame, screen space)
const fmtEUR = (v, cents = false) => {
  const neg = v < 0; v = Math.abs(v);
  const [i, d] = v.toFixed(cents ? 2 : 0).split('.');
  return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (cents ? ',' + d : '') + ' €';
};
// value rolls between keyframes [[t, v], ...] (absolute times); deltas pop out in red/green
function hud(title, keys, o = {}) {
  const x = o.x ?? W / 2, y = o.y ?? 250, cents = o.cents ?? false;
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const u = EZ.o3(clamp((TT - keys[i][0]) / 0.7)); v += (keys[i][1] - keys[i - 1][1]) * u; }
  const s = o.scale ?? 1, k = o.t0 != null ? springEase(TT - o.t0, 280, 18) : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);

  fillRR(-w / 2, -70, w, 150, 26, '#141026');
  fillRR(-w / 2, -70, w, 46, { tl: 26 } ? 26 : 0, '#231c40'); ctx.fillStyle = '#141026'; ctx.fillRect(-w / 2, -40, w, 16);
  tText(title, 0, -46, 26, { color: '#9f95c9', shadow: false, letter: 4, weight: 800 });
  const flash = keys.slice(1).some(([t]) => TT >= t && TT < t + 0.25);
  tText(val, 0, 22, 74, { color: o.color ?? (flash ? '#ffffff' : '#41f08a'), shadow: false, weight: 800 });
  ctx.restore();

  for (let i = 1; i < keys.length; i++) {
    const [t, b] = keys[i], d = b - keys[i - 1][1], u = (TT - t) / 1.2;
    if (u < 0 || u > 1 || Math.abs(d) < 0.001) continue;
    ctx.save(); ctx.globalAlpha = u < 0.75 ? 1 : 1 - (u - 0.75) / 0.25;
    const sc = springEase(TT - t, 300, 12);
    ctx.translate(x + (o.dx ?? 0) * s, y + 128 * s + u * 50); ctx.scale(sc, sc); ctx.rotate(-0.05);
    tText((d > 0 ? '+' : '') + fmtEUR(d, cents), 0, 0, 54, { color: d < 0 ? '#ff4a4a' : '#41f08a', stroke: '#1b0f2e', strokeW: 10 });
    ctx.restore();
  }
}

// ---------------------------------------------------------------- small things
function sparkle(x, y, s, c = '#fff', rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.22 : s; const a = (i / 8) * TAU; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }

function twinkles(seed, x, y, w, h, n, o = {}) {

    const px = x + R.f() * w, py = y + R.f() * h, ph = R.f() * TAU, sp = 3 + R.f() * 4, s = (o.s ?? 18) * (0.5 + R.f());
    const k = Math.max(0, Math.sin(TT * sp + ph)); if (k < 0.05) continue;

}
function impactLines(x, y, r0, r1, n, t0, o = {}) {
  const u = clamp((TT - t0) / (o.d ?? 0.35)); if (u <= 0 || u >= 1) return;
  const R = RNG('imp', t0);

// ---------------------------------------------------------------- money and coins

  if (w > 120 && o.num) { tText(o.num, -w * 0.33, -h * 0.25, h * 0.2, { color: PAL.cashL, shadow: false }); tText(o.num, w * 0.33, h * 0.25, h * 0.2, { color: PAL.cashL, shadow: false }); }

// ---------------------------------------------------------------- deterministic physics
// falling banknotes: spawn above, terminal velocity, side-to-side flutter, rotation and a 3D flip

  const lt = TT - t0; if (lt < 0) return;

    const w = (o.w ?? 110) * (0.65 + R.f() * 0.6), t = lt - delay; if (t < 0) continue;

// ---------------------------------------------------------------- captions (karaoke)
function captions(g) {
  const c = CHUNKS.find((k) => TT >= k.t0 - 0.02 && TT < k.t1); if (!c) return;
  const s = shotAt(TT); if (s.noCap) return;
  const size = 78, y0 = s.capY ?? 1480, ws = [];

  for (let i = c.a; i <= c.b; i++) ws.push({ ...WORDS[i], txt: WORDS[i].w.toUpperCase() });
  // lay out on 1 or 2 lines within 940 px
  const sp = size * 0.3, wid = ws.map((w) => textW(w.txt, size, 900));
  let lines = [[0, ws.length]], total = wid.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  if (total > 940 && ws.length > 1) { let acc = 0, cut = 1; for (let i = 0; i < ws.length; i++) { acc += wid[i] + sp; if (acc > total / 2) { cut = Math.max(1, i); break; } } lines = [[0, cut], [cut, ws.length]]; }
  const pop = springEase(TT - c.t0, 420, 20), lh = size * 1.12;
  ctx.save(); ctx.translate(W / 2, y0); ctx.scale(0.86 + 0.14 * pop, 0.86 + 0.14 * pop);
  lines.forEach(([a, b], li) => {
    const lw = wid.slice(a, b).reduce((p, q) => p + q, 0) + sp * (b - a - 1);
    let x = -lw / 2; const y = (li - (lines.length - 1) / 2) * lh;
    for (let i = a; i < b; i++) {
      const w = ws[i], on = TT >= w.s - 0.03, act = TT >= w.s - 0.03 && TT < w.e + 0.05;
      const k = act ? 1 + 0.12 * Math.sin(clamp((TT - w.s) / 0.18) * Math.PI) : 1;
      ctx.save(); ctx.translate(x + wid[i] / 2, y); ctx.scale(k, k);

      ctx.restore(); x += wid[i] + sp;

}

}
