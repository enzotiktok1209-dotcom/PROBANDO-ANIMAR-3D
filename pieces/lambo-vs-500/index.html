const FPS = 30, W = 1080, H = 1920;   // the layout space; frames render at 1440p:

// ---------------------------------------------------------------------
//  seeded RNG

// ---------------------------------------------------------------------
//  math

//  render state

  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step

//  main.js — shots, camera, transitions, captions, grade. renderFrame(t) draws one frame.
//  A shot: S(t0, { tr, cam, punch, shake, draw, ui, sfx, capY }) — every time is absolute (seconds).
//    cam   [[t, x, y, z], ...]  the world point (x, y) sits at the screen centre, zoom z, eased between keys
//    punch [[t, amount], ...]   spring zoom steps (each one stays), the "zoom punch"

  //  score-tail.js (from kit/score-tail.js, without the loop fold) — render, loudness stage

  // =====================================================================

async function renderAudioWav() { return wavB64(await buildScore(48000, 'mix')); }
async function renderAudioStems() {

  const music = await buildScore(48000, 'music', mix.norm), sfx = await buildScore(48000, 'sfx', mix.norm);

window.renderAudioWav = renderAudioWav;
window.renderAudioStems = renderAudioStems;
