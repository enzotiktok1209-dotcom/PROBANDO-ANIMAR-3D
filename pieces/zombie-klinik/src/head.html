<script>
"use strict";
// Zombie-Klinik (de) - flat-noir style, 9:16, 30fps
const FPS = 30, W = 1080, H = 1920;
const BPM = 112.5, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 110.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 340, right: 140 };
const HAND = '"Oswald", Impact, sans-serif';
const CX = 540;
// ---- the voice is the clock: VL(id) = a line, VW(id, word) = when a word starts
const VL = (id) => VOICE.lines.find((l) => l.id === id);
function VW(id, word, n = 1) { const L = VL(id); let k = 0; for (const w of L.words) if (w.w.toLowerCase().includes(word.toLowerCase()) && ++k === n) return w.t0; return L.t0; }
const at = (s) => (typeof s === 'number' ? s : s.includes(':') ? VW(...s.split(':')) : VL(s).t0);
// ---- the shot list: [start, scene, camera, args]. A shot starts 0.05s before its word; cameras in src/bridges.js:
//   in / out = slow push in / pull out (+ a heavier vignette), fin / fout = fast zoom (+ whoosh), hold = a drift, shake = impact
const SHOT_SPEC = [
  [0,              'curtain',   'fin',   { state: 'rise', alarm: true }],
  ['l02',          'curtain',   'in',    { state: 'arm', alarm: true, close: true }],
  ['l03',          'curtain',   'out',   { state: 'sit', title: true }],
  ['l03:während',  'face',      'in',    { who: 'lukas', face: 'scared', bg: 'room' }],
  ['l04',          'monitor',   'in',    { hr: [118, 124], hand: true }],
  ['l05',          'city',      'out',   {}],

  ['l15',          'monitor',   'hold',  { hr: [132, 140], beep: true }],
  ['l15:bei',      'curtain',   'in',    { state: 'stand', near: true }],
  ['l16',          'reach',     'in',    {}],
  ['l17',          'clip',      'fin',   {}],
  ['l18',          'monitor',   'shake', { hr: [146, 148], alarm: true }],
  ['l19',          'face',      'fin',   { who: 'lukas', face: 'panic', bg: 'red' }],
  ['l20',          'station',   'out',   {}],
  ['l21',          'corridor',  'in',    { turn: true, red: true }],
  ['l21:hat',      'corridor',  'fin',   { walk: true, red: true, close: true }],
  ['l22',          'doorPlate', 'in',    {}],
  ['l23',          'burst',     'shake', {}],
  ['l24',          'face',      'in',    { who: 'jana', face: 'determined', bg: 'redRoom', label: ['SCHWESTER JANA', 'NACHTSCHICHT · STATION 3'] }],

  ['l72',          'choice',    'in',    { pick: 'B' }],
  [107.45,         'endcard',   'hold',  {}],
];
const SHOT_LIST = SHOT_SPEC.map(([s, sc, cam, args], i) => [i ? Math.max(0, Math.round((at(s) - 0.05) * FPS) / FPS) : 0, sc, cam, args]);
const ERA_LIST = SHOT_LIST.map(([t0, sc, cam, args], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, () => SCENES[sc](args, i)]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,

  morphs: [],
  cues: {},
  acts: [

    { name: '2 Setup',     role: 'journey', t0: at('l05'), t1: at('l18') },
    { name: '3 Alarm',     role: 'peak',    t0: at('l18'), t1: at('l29:stumm') },
    { name: '4 Escape',    role: 'journey', t0: at('l29:stumm'), t1: at('l42') },

    { name: '7 Run',       role: 'goodbye', t0: at('l56'), t1: DURATION },
  ],
  board: [],
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
TIMELINE.board = TIMELINE.shots.map((s) => ({ t: Math.min(s.t1 - 0.05, s.t0 + Math.min(0.9, (s.t1 - s.t0) * 0.6)), title: s.id + ' ' + s.title, sound: '', next: '' }));
window.TIMELINE = TIMELINE;
