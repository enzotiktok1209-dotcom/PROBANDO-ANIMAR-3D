<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie-Klinik</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// Zombie-Klinik (de) - flat-noir style, 9:16, 30fps
const FPS = 30, W = 1080, H = 1920;
const BPM = 112.5, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 340, right: 140 };
const HAND = '"Oswald", Impact, sans-serif';
const CX = 540;
// LOOK CHECK: three style frames, one shot each (the full piece replaces this list from the voice timing)
const SHOT_LIST = [
  [0.0, 'room',     'push'],
  [2.0, 'corridor', 'push'],
  [4.0, 'elevator', 'push'],
];
const SCENE = { room: () => sceneRoom(), corridor: () => sceneCorridor(), elevator: () => sceneElevator() };
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
const SHOTS = SHOT_LIST.map(([t0, sc, cam], i) => [sc, i, t0, ERA_LIST[i][1], sc]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'beat-cut',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: {},
  acts: [{ name: 'look', role: 'build', t0: 0, t1: DURATION }],
  board: [
    { t: 1.5, title: 'Leo im Bett', sound: '-', next: 'cut' },
    { t: 3.5, title: 'der Flur', sound: '-', next: 'cut' },
    { t: 5.5, title: 'Regel #2', sound: '-', next: '-' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
